# ==============================================================
# eCare Production Nginx & Load Balancer Configuration
# ==============================================================

upstream ecare_backend_cluster {
    least_conn; # Load balancing strategy
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limiting zone (10 requests per second per IP)
limit_req_zone $binary_remote_addr zone=ecare_api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name ecare.community.gov;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecare.community.gov;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/ecare.community.gov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecare.community.gov/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # GZip & Brotli Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Client body limit (5MB spend cap on uploads)
    client_max_body_size 5M;

    # Frontend Static Files with Cache-Control
    location / {
        root /var/www/ecare/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Endpoints (Proxied to Django Gunicorn Load Balanced Cluster)
    location /api/ {
        limit_req zone=ecare_api_limit burst=20 nodelay;
        proxy_pass http://ecare_backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Static Media Files (Uploaded Documents)
    location /media/ {
        alias /var/www/ecare/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
